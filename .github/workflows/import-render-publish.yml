on:
  schedule:
    # Run after the private database repository publishes its checked bundle.
    - cron: '30 14 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

name: Publish Dashboard from Sanitized Data

# you need these permissions to publish to GitHub pages
permissions: 
    contents: write
    pages: write

jobs:
  import-render-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Check out privacy-checked data export
        uses: actions/checkout@v4
        with:
          ref: public-data
          path: .data-source
          sparse-checkout: public_export
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and install sanitized public data
        run: python3 code/install_public_export.py --source .data-source/public_export
                
      - name: Upload Unjournal data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unjournal-data
          path: |
            data/research.csv
            data/rsx_evalr_rating.csv
            data/evaluator_paper_level.csv
            data/public_export_manifest.json
      
      - name: Update Unjournal data in repository
        # There is a race condition here: if someone else, or another
        # copy of this workflow, commits and pushes data between initial
        # checkout and this push, then the push will fail. If this happens,
        # just rerun the workflow manually.
        #
        # `diff-index` with the `--exit-code` option returns 0 if there's no
        # difference between the working copy and the HEAD branch.
        #
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "Github Actions"
          git pull # try to minimize race condition
          git add data/research.csv data/rsx_evalr_rating.csv data/evaluator_paper_level.csv data/public_export_manifest.json
          git diff --cached --quiet || git commit -m "Update sanitized public data"
          git push
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
          # uncomment below and fill to pin a version
          # version: SPECIFIC-QUARTO-VERSION-HERE

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'
          
      - name: Install system dependencies
        run: |
          sudo apt-get install jags libcurl4-openssl-dev \
            libharfbuzz-dev libfribidi-dev libsodium-dev libfontconfig1-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libcairo2-dev
          
      - name: Setup dependencies with renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3 # clean cache after switching the package mirror
        env:
          GITHUB_PAT: ${{ secrets.RENV_GITHUB_PAT }}
          # Avoid intermittent PPM archive failures for versions pinned in renv.lock.
          RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org

      - name: Install plotly (not in renv.lock)
        run: |
          install.packages("plotly")
        shell: Rscript {0}

      - name: Publish dashboard to shinyapps.io
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          rsconnect::setAccountInfo(name = Sys.getenv("RSCONNECT_USER"), 
                                    token = Sys.getenv("RSCONNECT_TOKEN"),
                                    secret = Sys.getenv("RSCONNECT_SECRET"))
          quarto::quarto_publish_app(input = "shinyapp/dashboard", 
                                     account = "unjournal", 
                                     server = "shinyapps.io",
                                     forceUpdate = TRUE)
        shell: Rscript {0}
        
